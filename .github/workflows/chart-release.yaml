name: chart-release

# Publishes the Helm chart of a release tag to ghcr.io as an OCI artifact, at
# oci://ghcr.io/<owner>/charts/valkey-operator, where Artifact Hub lists it.
# release-pipeline calls it for every release tag, once the operator image is
# pushed. Run it by hand to publish the chart of an earlier tag.
#
# The chart has a repository of its own, apart from the operator image at
# ghcr.io/<owner>/valkey-operator, so a chart version can never take an image
# tag's place.
#
# Before the chart, it pushes the Artifact Hub repository metadata,
# charts/artifacthub-repo.yml, which marks the publisher as verified, so it is
# in place when Artifact Hub processes the new version. Tags made before that
# file existed publish the chart alone.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose chart to publish
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose chart to publish, such as v2.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish the Helm chart
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.tag }}
      CHART_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts
      OPERATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/valkey-operator
    steps:
    - name: Check the tag
      run: |
        if ! echo "$RELEASE_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "not a release tag: $RELEASE_VERSION"
          exit 1
        fi

    # The chart is taken from the tag, so its templates and CRDs match the
    # operator image of the same version.
    - name: Check out the tag
      uses: actions/checkout@v7
      with:
        ref: refs/tags/${{ inputs.tag }}

    # The chart version is the tag without its "v", and the operator image tag
    # is the tag itself: the chart passes that tag to the operator as its
    # version, which picks the actors that run each instance.
    - name: Package the chart
      run: |
        helm lint charts/valkey-operator
        helm package charts/valkey-operator \
          --version "${RELEASE_VERSION#v}" \
          --app-version "$RELEASE_VERSION" \
          --destination chart-dist

    # Rendered without a cluster, so the chart's check that cert-manager is
    # installed is skipped; the published chart keeps it.
    - name: Check the packaged chart
      run: |
        chart="chart-dist/valkey-operator-${RELEASE_VERSION#v}.tgz"
        rendered=$(helm template valkey-operator "$chart" --namespace valkey-system \
          --set certManager.preflightCheck.enabled=false)
        echo "$rendered" | grep -qF "image: ${OPERATOR_IMAGE}:${RELEASE_VERSION}" || {
          echo "the chart does not deploy ${OPERATOR_IMAGE}:${RELEASE_VERSION}"
          exit 1
        }
        echo "$rendered" | grep -qF "operatorVersion: \"${RELEASE_VERSION}\"" || {
          echo "the chart does not pass ${RELEASE_VERSION} to the operator as its version"
          exit 1
        }

    # The official release binary with its checksum checked, as e2e.yaml
    # installs kind: the repository only allows GitHub-owned and verified
    # actions.
    - name: Install oras
      if: hashFiles('charts/artifacthub-repo.yml') != ''
      env:
        ORAS_VERSION: "1.3.6"
      run: |
        archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
        base="https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}"
        curl -fsSLO "$base/$archive" -O "$base/oras_${ORAS_VERSION}_checksums.txt"
        grep " ${archive}\$" "oras_${ORAS_VERSION}_checksums.txt" | sha256sum -c -
        tar -xzf "$archive" oras
        sudo install -m 0755 oras /usr/local/bin/oras

    # Artifact Hub reads the metadata from the "artifacthub.io" tag of the
    # chart's repository, with these media types; Helm ignores that tag, which
    # is not a semantic version.
    - name: Push the Artifact Hub metadata
      if: hashFiles('charts/artifacthub-repo.yml') != ''
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        REGISTRY_USER: ${{ github.repository_owner }}
      working-directory: charts
      run: |
        echo "$GH_TOKEN" | oras login ghcr.io --username "$REGISTRY_USER" --password-stdin
        oras push "${CHART_REPOSITORY#oci://}/valkey-operator:artifacthub.io" \
          --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
          artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

    - name: Push the chart
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        REGISTRY_USER: ${{ github.repository_owner }}
      run: |
        echo "$GH_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
        helm push "chart-dist/valkey-operator-${RELEASE_VERSION#v}.tgz" "$CHART_REPOSITORY"
